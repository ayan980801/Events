name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (staging|production)"
        required: false
        default: "staging"
        type: choice
        options:
          - staging
          - production
      api_url:
        description: "API base URL for smoke check (optional)"
        required: false
        default: ""
  push:
    tags:
      - 'v*.*.*'

env:
  NODE_VERSION: '18.x'

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Backend Deps
        working-directory: backend
        run: npm ci

      - name: Build Backend
        working-directory: backend
        run: npm run build --if-present

  smoke-test:
    name: Post-Deploy Smoke Test
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - name: Curl Health
        run: |
          URL="${{ inputs.api_url }}"
          if [ -z "$URL" ]; then
            echo "API URL not set; skipping." && exit 0
          fi
          curl -sS "$URL"/health || true

  summary:
    name: Summary
    needs: [build-backend, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - name: Print Summary
        run: |
          echo "Ref: ${{ github.ref }}"
          echo "Actor: ${{ github.actor }}"
