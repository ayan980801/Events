name: Deploy to Production

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build and test before deployment
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install backend dependencies
      working-directory: ./backend
      run: npm ci

    - name: Run backend tests
      working-directory: ./backend
      run: npm run test
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        JWT_SECRET: test-jwt-secret
        NODE_ENV: test

    - name: Build backend
      working-directory: ./backend
      run: npm run build

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.9'
        channel: 'stable'

    - name: Install Flutter dependencies
      working-directory: ./mobile-app
      run: flutter pub get

    - name: Run Flutter tests
      working-directory: ./mobile-app
      run: flutter test

  # Build Docker images
  build:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      backend-image: ${{ steps.backend-meta.outputs.tags }}
      backend-digest: ${{ steps.backend-build.outputs.digest }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract backend metadata
      id: backend-meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-

    - name: Build and push backend image
      id: backend-build
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile.prod
        push: true
        tags: ${{ steps.backend-meta.outputs.tags }}
        labels: ${{ steps.backend-meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Deploy to staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment: staging

    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Deploy to ECS Staging
      run: |
        # Update ECS service with new image
        aws ecs update-service \
          --cluster ai-chatbot-staging \
          --service backend-service \
          --force-new-deployment

    - name: Wait for deployment to complete
      run: |
        aws ecs wait services-stable \
          --cluster ai-chatbot-staging \
          --services backend-service

    - name: Run health check
      run: |
        # Wait for service to be healthy
        sleep 30
        curl -f ${{ secrets.STAGING_API_URL }}/health || exit 1

    - name: Run smoke tests
      working-directory: ./backend
      run: |
        npm install
        npm run test:e2e:staging
      env:
        API_BASE_URL: ${{ secrets.STAGING_API_URL }}
        TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
        TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

  # Deploy to production
  deploy-production:
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.environment == 'production'
    environment: production

    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Create database backup
      run: |
        # Create backup before deployment
        aws rds create-db-snapshot \
          --db-snapshot-identifier "pre-deploy-$(date +%Y%m%d-%H%M%S)" \
          --db-instance-identifier ai-chatbot-prod

    - name: Deploy to ECS Production
      run: |
        # Update ECS service with new image
        aws ecs update-service \
          --cluster ai-chatbot-production \
          --service backend-service \
          --force-new-deployment

    - name: Wait for deployment to complete
      run: |
        aws ecs wait services-stable \
          --cluster ai-chatbot-production \
          --services backend-service

    - name: Run health check
      run: |
        # Wait for service to be healthy
        sleep 30
        curl -f ${{ secrets.PRODUCTION_API_URL }}/health || exit 1

    - name: Run production smoke tests
      working-directory: ./backend
      run: |
        npm install
        npm run test:e2e:production
      env:
        API_BASE_URL: ${{ secrets.PRODUCTION_API_URL }}
        TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
        TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

    - name: Notify deployment success
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: '🚀 Production deployment successful!'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # Mobile app deployment
  deploy-mobile:
    runs-on: macos-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.9'
        channel: 'stable'

    - name: Install dependencies
      working-directory: ./mobile-app
      run: flutter pub get

    - name: Build iOS
      working-directory: ./mobile-app
      run: |
        flutter build ios --release --no-codesign
        
    - name: Build Android
      working-directory: ./mobile-app
      run: |
        flutter build appbundle --release

    - name: Upload iOS to TestFlight
      uses: apple-actions/upload-testflight-build@v1
      with:
        app-path: mobile-app/build/ios/ipa/ai_chatbot_mobile.ipa
        issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
        api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
        api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

    - name: Upload Android to Play Console
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: com.example.ai_chatbot_mobile
        releaseFiles: mobile-app/build/app/outputs/bundle/release/app-release.aab
        track: internal

  # Rollback job
  rollback:
    runs-on: ubuntu-latest
    if: failure()
    needs: [deploy-production]
    environment: production

    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Rollback ECS deployment
      run: |
        # Get previous task definition
        PREVIOUS_TASK_DEF=$(aws ecs describe-services \
          --cluster ai-chatbot-production \
          --services backend-service \
          --query 'services[0].deployments[1].taskDefinition' \
          --output text)
        
        # Update service to previous task definition
        aws ecs update-service \
          --cluster ai-chatbot-production \
          --service backend-service \
          --task-definition $PREVIOUS_TASK_DEF

    - name: Notify rollback
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        text: '⚠️ Production deployment failed and was rolled back!'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}